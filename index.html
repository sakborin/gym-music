<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gym Music">
  <title>Gym Music</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body class="bg-[#15181e] pb-80 font-sans text-neutral-100 antialiased">

  <header class="mx-auto flex max-w-lg items-center justify-between px-5 pb-3 pt-7">
    <h1 class="text-2xl font-bold tracking-tight">Gym Music</h1>
    <label class="cursor-pointer rounded-full bg-[#6f8dff] px-5 py-2.5 text-sm font-semibold text-white">
      Add songs
      <input type="file" id="picker" accept="audio/*" multiple class="hidden">
    </label>
  </header>

  <section class="mx-auto mb-3 max-w-lg px-5">
    <div class="rounded-2xl border border-[#2b313b] bg-[#1e232b] p-4">
      <p class="mb-3 text-sm font-semibold">Listen together</p>
      <div class="flex gap-2">
        <button id="start" class="flex-1 rounded-xl bg-[#6f8dff] py-2.5 text-sm font-semibold text-white">Start session</button>
        <input id="code" inputmode="numeric" maxlength="4" placeholder="Code"
          class="w-20 rounded-xl border border-[#2b313b] bg-[#15181e] px-3 text-center text-sm outline-none focus:border-[#6f8dff]">
        <button id="join" class="rounded-xl border border-[#6f8dff] px-4 py-2.5 text-sm font-semibold text-[#6f8dff]">Join</button>
      </div>
      <p id="status" class="mt-3 text-sm text-[#8d96a3]">Not connected</p>
    </div>
  </section>

  <main class="mx-auto max-w-lg px-3">
    <p id="empty" class="px-5 py-16 text-center leading-relaxed text-[#8d96a3]">No songs yet. Tap “Add songs” and pick audio files from your phone.</p>
    <ul id="list"></ul>
  </main>

  <div class="fixed inset-x-0 bottom-0 border-t border-[#2b313b] bg-[#1e232b] px-5 pt-4 pb-[calc(1rem+env(safe-area-inset-bottom))]">
    <div class="mx-auto max-w-lg">
      <div id="now" class="mb-3 truncate text-[15px] font-semibold">Nothing playing</div>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek" class="w-full accent-[#6f8dff]">
      <div class="mt-1 flex justify-between text-xs text-[#8d96a3]"><span id="cur">0:00</span><span id="dur">0:00</span></div>

      <div class="mt-2 flex items-center justify-center gap-4 text-neutral-100">
        <button id="shuffle" class="flex size-11 items-center justify-center rounded-full text-[#8d96a3]" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
        </button>
        <button id="prev" class="flex size-11 items-center justify-center rounded-full" aria-label="Previous">
          <svg viewBox="0 0 24 24" class="size-6" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
        </button>
        <button id="play" class="flex size-[60px] items-center justify-center rounded-full bg-[#6f8dff] text-white" aria-label="Play or pause">
          <svg viewBox="0 0 24 24" class="size-7" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="next" class="flex size-11 items-center justify-center rounded-full" aria-label="Next">
          <svg viewBox="0 0 24 24" class="size-6" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
        </button>
        <button id="loop" class="flex size-11 items-center justify-center rounded-full text-[#8d96a3]" aria-label="Loop">
          <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <div class="mt-3 flex items-center justify-center gap-2 text-xs text-[#8d96a3]">
        <span>Out of sync?</span>
        <button id="back" class="rounded-full border border-[#2b313b] px-3 py-1.5">Back 50ms</button>
        <button id="ahead" class="rounded-full border border-[#2b313b] px-3 py-1.5">Ahead 50ms</button>
      </div>
    </div>
  </div>

  <audio id="player"></audio>
  <script src="app.js"></script>
</body>
</html>
